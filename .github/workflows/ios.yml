
name: Ejecutar ConsultaAPI en iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar aplicación
        run: |
          xcodebuild \
            -project ConsultaAPI.xcodeproj \
            -scheme ConsultaAPI \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Iniciar simulador de iPhone
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone.*\([A-F0-9-]{36}\)' | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Instalar aplicación
        run: |
          xcrun simctl install "$DEVICE_ID" \
            build/Build/Products/Debug-iphonesimulator/ConsultaAPI.app

      - name: Ejecutar aplicación
        run: |
          xcrun simctl launch "$DEVICE_ID" com.consultaapi.app
          sleep 20

      - name: Capturar pantalla del iPhone
        run: |
          mkdir -p evidencias
          xcrun simctl io "$DEVICE_ID" screenshot evidencias/ConsultaAPI-iPhone.png

      - name: Guardar evidencias
        uses: actions/upload-artifact@v4
        with:
          name: Evidencias-ConsultaAPI
          path: evidencias/
